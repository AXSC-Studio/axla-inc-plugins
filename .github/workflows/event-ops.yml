# event-ops（axla-marketing の機能）の検証器。spec 002。
# テスト（実行境界・承認ゲート・検査の道具）と、公開リポに特定の会社・人の情報が入っていないかを見る。
# 秘密の語の一覧は Secrets の NEUTRAL_DENYLIST（1行1語）。無ければ、形の検査だけになる。
name: event-ops

on:
  pull_request:
    paths:
      - "plugins/axla-marketing/**"
      - ".github/workflows/event-ops.yml"
  push:
    branches: [main]
    paths:
      - "plugins/axla-marketing/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: テスト（実行境界・承認ゲート・検査の道具）
        run: python3 -m unittest discover -s plugins/axla-marketing/event-ops/tests -v
      - name: 中立の検査（特定の会社・人の情報が無いか）
        env:
          NEUTRAL_DENYLIST: ${{ secrets.NEUTRAL_DENYLIST }}
        run: python3 plugins/axla-marketing/event-ops/scripts/check_neutral.py plugins/axla-marketing/event-ops
