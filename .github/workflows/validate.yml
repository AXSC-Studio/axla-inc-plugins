name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run plugin tests
        run: |
          set -e
          found=0
          for d in plugins/*/scripts/tests plugins/*/*/scripts/tests; do
            [ -d "$d" ] || continue
            found=1
            echo "== $d"
            python3 -I -m unittest discover -s "$d" -v
          done
          [ "$found" = 1 ] || echo "no tests found"

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate marketplace and plugins
        run: |
          set -e
          claude plugin validate --strict .
          for p in plugins/*/; do
            echo "== $p"
            claude plugin validate --strict "$p"
          done

  repo-checks:
    name: version bump and contract files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          python3 -I .github/scripts/check_repo.py "$base"
