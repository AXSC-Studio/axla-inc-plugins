name: event-ops の学び（件数だけ）
description: event-ops（axla-marketing）を使った外側のループの学びを、件数だけで本体へ戻す（spec 009）
title: "event-ops learning: "
labels: ["event-ops", "learning"]
body:
  - type: markdown
    attributes:
      value: |
        **名前・会社名・メールアドレス・本文は書かないでください。** 件数と、効いた／効かなかった柵の名前だけを書きます。
        数は `register.csv`・`runs.jsonl`・`review.md`（review-event が作る）から写せます。
  - type: input
    id: scale
    attributes:
      label: イベントの規模（定員のおよその数）
      placeholder: "例：40〜50"
    validations:
      required: true
  - type: textarea
    id: judgments
    attributes:
      label: 人の判断の数（前回 → 今回）
      placeholder: "例：24 → 9"
    validations:
      required: true
  - type: textarea
    id: fail_codes
    attributes:
      label: よく出た失敗（fail_code と回数）
      placeholder: |
        unapproved_recipient：2
        max_rounds：1
  - type: textarea
    id: guards
    attributes:
      label: 効いた柵・効かなかった柵（道具の名前で）
      placeholder: "例：送った版の上書きを guard_send が止めた／Luma の道具の名前が分け方に合わず config に足した"
  - type: textarea
    id: proposal
    attributes:
      label: 本体（ひな形・既定値・柵）に足すとよいこと
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 名前・会社名・メールアドレス・本文を書いていない
          required: true
